# Blueprint de Render para Evolution API (WhatsApp) = API + PostgreSQL + Redis (Key Value).
# Uso: Render Dashboard → New → Blueprint → elige este repo → "Blueprint Path": infra/whatsapp/render.yaml
# Guía completa: infra/whatsapp/README.md
services:
  - type: web
    name: evolution-api-umg
    region: oregon           # los 3 recursos DEBEN estar en la misma región para hablarse por red interna
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:v2.3.7
    plan: starter            # WhatsApp (Baileys) necesita RAM y estar siempre encendido: el plan free no alcanza
    healthCheckPath: /
    envVars:
      # Puerto: Render espera 10000 por defecto
      - key: SERVER_PORT
        value: "10000"
      # URL pública de este servicio. Render te la pide al crear el Blueprint
      # (https://evolution-api-umg.onrender.com, o la que te asigne si el nombre ya existe)
      - key: SERVER_URL
        sync: false
      # Clave maestra. Render la genera; cópiala de Environment → AUTHENTICATION_API_KEY
      # y pégala en el backend como WhatsApp:ApiKey
      - key: AUTHENTICATION_API_KEY
        generateValue: true

      # Base de datos (la crea este mismo Blueprint)
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        fromDatabase:
          name: evolution-db
          property: connectionString
      - key: DATABASE_CONNECTION_CLIENT_NAME
        value: evolution_umg
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "false"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "false"
      - key: DATABASE_SAVE_DATA_CONTACTS
        value: "false"
      - key: DATABASE_SAVE_DATA_CHATS
        value: "false"

      # Redis (Key Value de Render, red interna)
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        fromService:
          type: keyvalue
          name: evolution-redis
          property: connectionString
      - key: CACHE_REDIS_PREFIX_KEY
        value: evolution
      - key: CACHE_REDIS_SAVE_INSTANCES
        value: "false"
      - key: CACHE_LOCAL_ENABLED
        value: "false"

      # Sesión de WhatsApp
      - key: CONFIG_SESSION_PHONE_CLIENT
        value: UMG Lenguajes Formales
      - key: CONFIG_SESSION_PHONE_NAME
        value: Chrome
      - key: QRCODE_LIMIT
        value: "30"
      - key: LOG_LEVEL
        value: ERROR,WARN,INFO

  - type: keyvalue
    name: evolution-redis
    region: oregon
    plan: free
    ipAllowList: []          # solo accesible desde la red interna de Render

databases:
  - name: evolution-db
    region: oregon
    plan: basic-256mb        # el plan free de Postgres en Render expira a los 30 días
