server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Resuelve servicios Docker dinámicamente.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Validación HTTP del certificado.
    location ^~ /.well-known/pki-validation/ {
        include /etc/nginx/security-headers.conf;
        alias /var/www/ssl-validation/.well-known/pki-validation/;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # API y archivos del usuario.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # El TLS termina en el proxy público del VPS; conserva el esquema
        # original para redirecciones externas, incluido OAuth de Google.
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    }

    location /uploads/ {
        include /etc/nginx/security-headers.conf;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    # Recursos generados por Nuxt.
    location ^~ /_nuxt/ {
        include /etc/nginx/security-headers.conf;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Modelos de reconocimiento facial.
    location ^~ /models/ {
        include /etc/nginx/security-headers.conf;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ^~ /images/ {
        include /etc/nginx/security-headers.conf;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # No cachear páginas de la aplicación.
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    }
}
