server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Docker reasigna IPs al reconstruir un contenedor. La resolución dinámica
    # evita que Nginx conserve una IP anterior y responda 502 durante un deploy.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Defensa en profundidad para todas las respuestas de la aplicación.
    # CSP se configura en el Nginx público al terminar HTTPS, porque reCAPTCHA
    # requiere dominios externos y una política incompleta bloquearía el acceso.

    # Validación de control de dominio para certificados TLS. Esta ruta no pasa
    # por Nuxt ni por el backend: la CA debe poder leer el TXT directamente.
    location ^~ /.well-known/pki-validation/ {
        include /etc/nginx/security-headers.conf;
        alias /var/www/ssl-validation/.well-known/pki-validation/;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }

    # API y archivos cargados por los usuarios: mismo origen para evitar CORS.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    }

    location /uploads/ {
        include /etc/nginx/security-headers.conf;
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "private, no-store, max-age=0" always;
    }

    # Nuxt usa nombres con hash para JS y CSS: estos archivos son inmutables
    # hasta el siguiente build, por lo que el navegador puede reutilizarlos.
    location ^~ /_nuxt/ {
        include /etc/nginx/security-headers.conf;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Recursos públicos que cambian con menor frecuencia. Los modelos faciales
    # son grandes y se reutilizan entre inicios de sesión.
    location ^~ /models/ {
        include /etc/nginx/security-headers.conf;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000" always;
    }

    location ^~ /images/ {
        include /etc/nginx/security-headers.conf;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # HTML y rutas de la aplicación pueden depender de sesión: no se cachean.
        add_header Cache-Control "no-store, no-cache, max-age=0, must-revalidate" always;
    }
}
