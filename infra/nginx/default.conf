server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Docker reasigna IPs al reconstruir un contenedor. La resolución dinámica
    # evita que Nginx conserve una IP anterior y responda 502 durante un deploy.
    resolver 127.0.0.11 ipv6=off valid=10s;

    # API y archivos cargados por los usuarios: mismo origen para evitar CORS.
    location /api/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend_upstream backend;
        proxy_pass http://$backend_upstream:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $frontend_upstream frontend;
        proxy_pass http://$frontend_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
