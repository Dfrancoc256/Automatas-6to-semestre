services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${DB_CONNECTION_STRING}
      Jwt__SecretKey: ${JWT_SECRET_KEY}
      Recaptcha__SecretKey: ${RECAPTCHA_SECRET_KEY}
      WhatsApp__BaseUrl: ${WHATSAPP_BASE_URL:-}
      WhatsApp__ApiKey: ${WHATSAPP_API_KEY:-}
      WhatsApp__InstanceName: ${WHATSAPP_INSTANCE_NAME:-umg-lenguajes}
      EmailSettings__Username: ${EMAIL_USERNAME:-}
      EmailSettings__Password: ${EMAIL_PASSWORD:-}
      App__PublicUrl: ${APP_PUBLIC_URL}
      AllowedOrigins: ${ALLOWED_ORIGINS}
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - privada

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE: /api
      NUXT_PUBLIC_RECAPTCHA_SITE_KEY: ${NUXT_PUBLIC_RECAPTCHA_SITE_KEY}
    networks:
      - privada

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${APP_PORT:-5000}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - privada

volumes:
  backend_uploads:

networks:
  privada:
    driver: bridge
